<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMEN DRIFT — a lantern keeper survival</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05060f;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #stage {
    position: relative;
    width: 1280px;
    height: 720px;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 720px;
    background: #070a1d;
    cursor: crosshair;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script type="module">
  import { boot } from './src/main.js';
  import { driveShot } from './src/shots.js';

  const params = new URLSearchParams(window.location.search);
  const shot = params.get('shot');
  const seed = Number(params.get('seed') || '1') || 1;
  const canvas = document.getElementById('game');

  if (shot) {
    const { game, ctx } = boot(canvas, { seed, shot: true, shotMode: shot });
    driveShot(game, ctx, shot);
  } else {
    const { game } = boot(canvas, { seed });
    // Exposed for headless playtests (read-only state checks).
    window.__game = game;
  }
</script>
</body>
</html>
